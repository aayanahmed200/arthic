name: Frontend quality and security

on:
  push:
    branches:
      - quality-pass-v21-site-wide
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-quality.yml"

permissions:
  contents: read

concurrency:
  group: arthic-frontend-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: TypeScript, API tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run the production build and all API/question-bank tests
        run: npm run build

      - name: Audit question provenance, difficulty and repeated templates
        run: npm run audit:questions

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production and development dependencies
        run: npm audit --audit-level=high

  refresh-lockfile:
    name: Synchronize the frontend lockfile on the working branch
    if: github.event_name == 'push' && github.ref == 'refs/heads/quality-pass-v21-site-wide'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out the working branch
        uses: actions/checkout@v4
        with:
          ref: quality-pass-v21-site-wide

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate lockfile without running dependency install scripts
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit only a changed lockfile
        working-directory: .
        shell: bash
        run: |
          if git diff --quiet -- frontend/package-lock.json; then
            echo "The frontend lockfile is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "Synchronize frontend dependency lockfile"
          git push origin HEAD:quality-pass-v21-site-wide
