<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>arthic admin</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>

<div class="login" id="loginView">
  <form id="loginForm">
    <p class="login__label">arthic admin</p>
    <input type="text" id="loginUser" placeholder="username" autocomplete="username" value="admin">
    <input type="password" id="loginPass" placeholder="password" autocomplete="current-password">
    <button type="submit">sign in</button>
    <p class="login__error" id="loginError"></p>
  </form>
</div>

<div class="app" id="appView" hidden>
  <header class="app__header">
    <p class="app__title">arthic admin</p>
    <nav class="app__tabs">
      <button class="app__tab is-active" data-tab="subscribers">waitlist</button>
    </nav>
    <button class="app__signout" id="signOutBtn">sign out</button>
  </header>

  <main>
    <!-- ===== WAITLIST TAB ===== -->
    <section class="panel is-active" id="subscribersPanel">
      <p class="panel__heading"><span id="subCount">0</span> on the waitlist</p>
      <button id="exportBtn">copy all emails</button>
      <p class="panel__status" id="exportStatus"></p>
      <ul id="subList" class="sub-list"></ul>
    </section>
  </main>
</div>

<script src="admin.js"></script>
</body>
</html>
